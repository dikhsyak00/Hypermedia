<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batman</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            font-family: Georgia, "Times New Roman", serif;
            color: white;

            /* Dark aesthetic background */
            background:
                linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.8)),
                url("batman-background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .container {
            padding: 40px;
        }

        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 80px;
            letter-spacing: 12px;
            text-transform: uppercase;
            text-shadow:
                0 0 10px #ffffff,
                0 0 25px #555;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            color: #cccccc;
            margin-bottom: 30px;
            font-style: italic;
        }

        img {
            width: 350px;
            max-width: 90%;
            border-radius: 10px;
            box-shadow:
                0 0 20px rgba(255, 255, 255, 0.2),
                0 0 50px rgba(0, 0, 0, 0.9);
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Batman</h1>

        <p>Here is a menacing image of Batman.</p>

        <img src="batman2.jfif" alt="Batman">
    </div>

</body>
</html>
